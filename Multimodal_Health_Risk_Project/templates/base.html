<!doctype html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>HealthRisk AI</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

          <!-- Font Awesome Icons -->
    <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
>
</head>


<body>


<!-- ===================================================== -->
<!-- NAVIGATION BAR -->
<!-- ===================================================== -->

<nav class="main-navbar">

    <div class="navbar-inner">

        <!-- LOGO + PROJECT NAME -->
        <a href="/" class="brand">

            <span class="brand-icon">
                <i class="fa-solid fa-heart-pulse"></i>
            </span>

            <span class="brand-text">
                HealthRisk AI
            </span>

        </a>


        <!-- NAVIGATION BUTTONS -->
        <div class="nav-buttons">

            <!-- HOME -->
            <a
                href="/"
                class="nav-box {% if request.path == '/' %}active{% endif %}"
            >
                <i class="fa-solid fa-house"></i>
                <span>Home</span>
            </a>


            <!-- DASHBOARD -->
            <a
                href="/dashboard"
                class="nav-box {% if request.path == '/dashboard' or request.path == '/result-dashboard' %}active{% endif %}"
            >
                <i class="fa-solid fa-chart-pie"></i>
                <span>Dashboard</span>
            </a>


            <!-- ABOUT -->
            <a
                href="/about"
                class="nav-box {% if request.path == '/about' %}active{% endif %}"
            >
                <i class="fa-solid fa-circle-info"></i>
                <span>About</span>
            </a>

        </div>

    </div>

</nav>

<main class="site-main">

    <!-- =====================================================
         GLOBAL MEDICAL DOODLE BACKGROUND
         Appears throughout the complete project
         ===================================================== -->

    <div class="global-doodle-background" aria-hidden="true">

        <img
            src="{{ url_for('static', filename='images/medical-doodle-bg.png') }}"
            alt=""
        >

    </div>

    <div class="project-shell">

        {% block content %}

        {% endblock %}

    </div>

    </div>

</main>
